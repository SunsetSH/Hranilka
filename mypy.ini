# Конфигурация mypy для «Хранилки».
#
# Строго проверяем Qt-free слой данных/логики (модели, конфиг, крипто, бэкап,
# БД и мелкие утилиты) — там типы дают реальную пользу и не тонут в шуме Qt.
# UI-модули (main, dialogs, widgets, tabs, theme, titlebar, flowlayout) на Qt
# проверяются мягко: PySide6-типы динамичны и дают много ложных срабатываний.
[mypy]
python_version = 3.10
ignore_missing_imports = True
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_optional = True
check_untyped_defs = True
files =
    hranilka/data/models,
    hranilka/data/errors,
    hranilka/data/database,
    hranilka/core/domain.py,
    hranilka/core/config.py,
    hranilka/core/paths.py,
    hranilka/core/util.py,
    hranilka/core/shortcuts.py,
    hranilka/core/instance_lock.py,
    hranilka/crypto/store.py,
    hranilka/services/backup.py,
    hranilka/generators/pd_generator.py,
    hranilka/generators/password_gen.py

# SQLite-слой: conn/cursor/_dek/_header по дизайну None вне открытой сессии
# (до connect()/после lock()), но все публичные методы вызываются только при
# открытой БД. Это даёт лавину ложных union-attr/arg-type на None-вариантах —
# глушим именно их, сохраняя прочие проверки (аннотации, return-типы и т.п.).
[mypy-hranilka.data.database.database]
disable_error_code = union-attr, arg-type

# Mixin-модули Database наследуют ту же договорённость: conn/cursor/_dek по
# дизайну None вне открытой сессии — глушим только ложные None-варианты.
[mypy-hranilka.data.database.persistence]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.schema]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.concurrency]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.tree_ops]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.accounts]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.fin_items]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.gallery_ops]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.bulk]
disable_error_code = union-attr, arg-type

[mypy-hranilka.data.database.migrations.runner]
disable_error_code = union-attr, arg-type

[mypy-PySide6.*]
ignore_missing_imports = True

[mypy-argon2.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True
