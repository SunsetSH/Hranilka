# Линтер «Хранилки». Запуск: python -m ruff check .
target-version = "py313"
line-length = 100
extend-exclude = ["venv", "build", "dist"]

[lint]
select = ["E", "F", "B", "UP"]
ignore = [
    "E501",   # длина строки: русские комментарии/докстринги длиннее 100
    "B008",   # вызовы в аргументах по умолчанию (Qt)
    "UP037",  # кавычки в аннотациях
    # Стилевой долг кодовой базы (не баги); снимать по мере рефакторинга:
    "E702",   # `a; b` в одной строке (компактные Qt-сеттеры)
    "E741",   # имена l/I/O
    "E402",   # импорты не в начале (sys.path-хаки)
    "UP007",  # Optional[X] vs X | None — проект смешивает стили
    "UP035",
    "UP038",
    "B905",   # zip(strict=) — поведение осознанное
    "B904",   # raise ... from
    "B017",
    "B018",
    "UP012",
    "UP015",
]

[lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
