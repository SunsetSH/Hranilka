name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Tests
        run: python -m pytest -q
      - name: Mypy
        run: python -m mypy
      - name: Ruff
        run: python -m ruff check .

  release-tag:
    # Тег релиза обязан совпадать с hranilka.__version__ (допустим префикс "v").
    if: startsWith(github.ref, 'refs/tags/')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify tag == __version__
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $ver = python -c "import hranilka; print(hranilka.__version__)"
          if ($tag -ne $ver) { throw "Тег '$tag' != hranilka.__version__ '$ver'" }
          Write-Host "OK: $tag"
