<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Основной корпус: сине-голубой градиент (Web 2.0 / aqua) -->
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#4aa3ff"/>
      <stop offset="0.5" stop-color="#1f6fe0"/>
      <stop offset="1"   stop-color="#0b3f9c"/>
    </linearGradient>
    <!-- Верхний глянцевый блик -->
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1"   stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <!-- Щит: серебристый металл -->
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0"   stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#e6edf5"/>
      <stop offset="1"   stop-color="#b9c6d6"/>
    </linearGradient>
    <radialGradient id="hole" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#2a3340"/>
      <stop offset="1" stop-color="#0d1218"/>
    </radialGradient>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001a4d" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Корпус-бейдж -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="url(#body)" filter="url(#ds)"/>
  <!-- Внутренняя рамка-обводка -->
  <rect x="40" y="40" width="432" height="432" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.25" stroke-width="4"/>

  <!-- Глянец сверху -->
  <path d="M64 144 Q64 64 144 64 L368 64 Q448 64 448 144 L448 236
           Q256 300 64 236 Z" fill="url(#gloss)"/>

  <!-- Щит -->
  <path d="M256 120
           L370 160
           L370 288
           Q370 372 256 420
           Q142 372 142 288
           L142 160 Z"
        fill="url(#shield)" stroke="#8ea3ba" stroke-width="4"/>

  <!-- Замочная скважина -->
  <circle cx="256" cy="250" r="40" fill="url(#hole)"/>
  <path d="M240 270 L272 270 L282 340 L230 340 Z" fill="url(#hole)"/>
</svg>
